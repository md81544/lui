# Note that full YAML is not supported.
# Only key : values and SINGLE-depth blocks
# which obviously support more key : value pairs.

# Maximum colour depth.
# Options: mono, ansi16, ansi256, or trueColour
colourDepth: trueColour

# Word Complexity
# Options: 1 (least), 2, or 3 (most complex)
wordComplexityLevel: 3

debug:
  focusReporting: false

release:
  focusReporting: true
